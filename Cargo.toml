[workspace]
resolver = "3"
members = ["crates/focus-types", "crates/focus-core", "crates/focus-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/valere91/focus-engine"
rust-version = "1.88"

[workspace.dependencies]
focus-types = { path = "crates/focus-types" }
focus-core = { path = "crates/focus-core" }

anyhow = "1.0.104"
async-trait = "0.1.92"
csv = "1.4.0"
dioxus = "0.7.10"
directories = "6.0.0"
futures = "0.3"
jiff = { version = "0.2.38", features = ["serde"] }
open = "5.4.4"
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "system-proxy"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "time"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
